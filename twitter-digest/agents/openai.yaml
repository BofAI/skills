interface:
  display_name: "Twitter Digest"
  short_description: "Generate safe X and X Chat daily digests"
  default_prompt: "Use $twitter-digest to generate my Chinese X daily digest through the API-only flow. Run the installed wrapper directly and never write replacement collection code. If a Terminal opens, ask me to finish the secure setup there without pasting credentials into chat, then rerun after I confirm. Keep the report concise and natural. Tell me who liked or replied to my recent posts; describe an incoming reply directly instead of calling its status unconfirmed. If safe X Chat scanning stops early, say only X Chat 已检查最近的 N 个会话 and never claim the remainder was empty. For historical Chat conversations whose contents are unavailable, say only 曾经收到过消息 and list the known senders. Never send, reply, accept requests, or perform other write actions."
