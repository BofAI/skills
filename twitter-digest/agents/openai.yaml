interface:
  display_name: "Twitter Digest"
  short_description: "Generate complete X and X Chat daily digests"
  default_prompt: "Use $twitter-digest to generate my complete X daily digest through the API-only flow. API credentials and X Chat decryption configuration are required. If a Terminal opens, do not ask for credentials or the X Chat passcode in chat; tell me to finish the Terminal flow, then rerun the digest after I say configuration is done. Include X Chat conversations, mentions, timeline hotspots, own-account activity, action items, and clearly marked data gaps. For ordinary follow-ups like 要, 日报, 生成, or 继续, run the default command again and do not reuse prior context."
