interface:
  display_name: "Twitter Digest"
  short_description: "Generate safe X and X Chat daily digests"
  default_prompt: "Use $twitter-digest to generate my concise Chinese X daily digest through the installed API-only wrapper; never write replacement collection code. If a Terminal opens, ask me to finish setup there without pasting credentials into chat. If X Chat has no passcode, follow the wizard's friendly X Messages guidance. Tell me who liked or replied to my recent posts. Use the default bounded Chat scan unless I explicitly ask to see more. If scanning stops early, say only X Chat 已按 X 返回顺序检查 N 个会话 and never claim the remainder was empty. For unavailable historical conversations, say only 曾经收到过消息 and list known senders. Use friendly rate-limit categories without paths or IDs. Never generate, recommend, rewrite, or send reply content; never accept requests or perform other write actions."
