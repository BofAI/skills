name: Validate versions

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check repository and skill versions
        run: sh scripts/check_versions.sh
